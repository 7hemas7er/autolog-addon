name: AutoLog
version: "1.1.0"
slug: autolog
description: Registro di rifornimenti, consumi e manutenzione dei veicoli
url: https://github.com/7hemas7er/autolog-addon
# node:24-alpine esiste solo per amd64 e arm64: dichiarare armv7 farebbe
# fallire la build su un Raspberry Pi a 32 bit.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto

# L'interfaccia viene servita dall'Ingress: nessuna porta da esporre e
# nessuna autenticazione interna, la fa Home Assistant.
ingress: true
ingress_port: 8099
panel_icon: mdi:gas-station
panel_title: AutoLog
# Di default la voce in sidebar e' riservata al gruppo admin: con false la
# vedono anche gli utenti non amministratori (l'Ingress li autentica lo stesso).
panel_admin: false

# Serve per leggere le credenziali del broker da http://supervisor/services/mqtt
hassio_api: true
services:
  - mqtt:want

# Porta opzionale: lasciala vuota se usi solo l'Ingress
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Accesso diretto senza Ingress (facoltativo)

options:
  mqtt_enabled: true
  force_password: false

schema:
  mqtt_enabled: bool
  force_password: bool
  password: str?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
