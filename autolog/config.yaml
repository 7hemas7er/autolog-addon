name: AutoLog
version: "1.2.0"
slug: autolog
description: Vehicle fuel-up, running cost and maintenance logbook, in English and Italian
url: https://github.com/7hemas7er/autolog-addon
# node:24-alpine is not published for armv7: declaring it would fail the build
# on a 32-bit Raspberry Pi.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto

# The interface is served through Ingress: no ports to expose and no built-in
# authentication, Home Assistant does it.
ingress: true
ingress_port: 8099
panel_icon: mdi:gas-station
panel_title: AutoLog
# By default the sidebar entry is restricted to the admin group; false makes it
# visible to non-admin users too (Ingress still authenticates them).
panel_admin: false

# Needed to read the broker credentials from http://supervisor/services/mqtt
hassio_api: true
services:
  - mqtt:want

# Optional port: leave it empty if you only use Ingress
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direct access without Ingress (optional)

options:
  mqtt_enabled: true
  force_password: false

schema:
  mqtt_enabled: bool
  force_password: bool
  password: str?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
